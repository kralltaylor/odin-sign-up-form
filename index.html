<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Sign-Up</title>
</head>
<body>
    <header class="sidebar">
        <div class="headline">
            <img src="img/odin-lined.png" class="logo">
            <h1 class="headline-text">ODIN</h1>
        </div>
        <div class="sidebar-footer">Photo by 
            <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on 
            <a href="https://unsplash.com/">Unsplash</a></div>
    </header>
    <div class="form-page">
        <div class="form-header">
            <div class="description">This is not a real online service! You know you
                need something like this in your life to help you realize your deepest
                dreams.
                <br>
                Sign up <em>now</em> to get started.
            </div>
        </div>
        <div class="form-info">
            <p class="form-title">Let's do this!</p>
        </div>
        <form action="" method="get" class="signup-form">
            <div class="form-row">
                <label for="first-name">FIRST NAME</label>
                <input type="text" id="first-name" name="first-name"
                        pattern="[A-Za-z]" required>
            </div> 
            <div class="form-row">
                <label for="last-name">LAST NAME</label>
                <input type="text" id="last-name" name="last-name"
                        pattern="[A-Za-z]" required>
            </div> 
            <div class="form-row">
                <label for="email">EMAIL</label>
                <input type="email" id="email" name="email" required>
            </div> 
            <div class="form-row">
                <label for="phone">PHONE NUMBER</label>
                <input type="tel" id="phone" name="phone" 
                        pattern="([0-9]{3}-[0-9]{3}-[0-9]{4})|([0-9]{10})" required>
            </div> 
            <div class="form-row">
                <label for="password">PASSWORD</label>
                <input type="password" id="password" name="password" required>
            </div> 
            <div class="form-row">
                <label for="confirm-pass">CONFIRM PASSWORD</label>
                <input type="password" id="confirm-pass" name="confirm-pass" required>
            </div> 
            <div class="form-footer">
                <button class="create-button">Create Account</button>
                <p class="login-footer">Already have an account? 
                    <span class="login">Log in</span></p>
            </div>
        </form>
    </div>
</body>
</html>
